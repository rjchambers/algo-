[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-trader"
version = "0.2.0"
description = "Hyperliquid multi-signal trading system (Phase 0-2: scaffold, backtest harness, signals)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "ccxt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "detect-secrets>=1.4",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests requiring live network access to exchange APIs (skipped unless --run-live)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
